<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java</title>
    <link rel="stylesheet" href="violan.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
     <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="violan (2).png">
</head>
<body>
      <div class="app">
        <header class="header">
            <div class="logo">
                🎻 <span>VIOLIN</span>
            </div>
            <div class="status">
                <span class="status-dot"></span>
                READY TO PLAY
            </div>
        </header>
        <main>
            <section class="hero">
                <p class="small-title">VIRTUAL INSTRUMENT</p>
                <h1>Play Your <span>Violin</span></h1>
                <p class="description">
                    Press the keyboard keys or click the keys below to play different violin sounds.
                </p>
            </section>
            <section class="player">
                <div class="now-playing">
                    <span>NOW PLAYING</span>
                    <strong id="currentKey">—</strong>
                </div>
                <div class="keys">
                    <button class="key" data-key="q">
                        <span>Q</span>
                        <small>01</small>
                    </button>
                    <button class="key" data-key="w">
                        <span>W</span>
                        <small>02</small>
                    </button>
                    <button class="key" data-key="e">
                        <span>E</span>
                        <small>03</small>
                    </button>
                    <button class="key" data-key="r">
                        <span>R</span>
                        <small>04</small>
                    </button>
                    <button class="key" data-key="t">
                        <span>T</span>
                        <small>05</small>
                    </button>
                    <button class="key" data-key="y">
                        <span>Y</span>
                        <small>06</small>
                    </button>
                    <button class="key" data-key="u">
                        <span>U</span>
                        <small>07</small>
                    </button>
                    <button class="key" data-key="i">
                        <span>I</span>
                        <small>08</small>
                    </button>
                    <button class="key" data-key="o">
                        <span>O</span>
                        <small>09</small>
                    </button>
                    <button class="key" data-key="p">
                        <span>P</span>
                        <small>10</small>
                    </button>
                    <button class="key" data-key="a">
                        <span>A</span>
                        <small>11</small>
                    </button>
                    <button class="key" data-key="s">
                        <span>S</span>
                        <small>12</small>
                    </button>
                    <button class="key" data-key="d">
                        <span>D</span>
                        <small>13</small>
                    </button>
                    <button class="key" data-key="f">
                        <span>F</span>
                        <small>14</small>
                    </button>
                    <button class="key" data-key="g">
                        <span>G</span>
                        <small>15</small>
                    </button>
                    <button class="key" data-key="h">
                        <span>H</span>
                        <small>16</small>
                    </button>
                    <button class="key" data-key="j">
                        <span>J</span>
                        <small>17</small>
                    </button>
                    <button class="key" data-key="k">
                        <span>K</span>
                        <small>18</small>
                    </button>
                    <button class="key" data-key="l">
                        <span>L</span>
                        <small>19</small>
                    </button>
                    <button class="key" data-key="z">
                        <span>Z</span>
                        <small>20</small>
                    </button>
                    <button class="key" data-key="x">
                        <span>X</span>
                        <small>21</small>
                    </button>
                    <button class="key" data-key="c">
                        <span>C</span>
                        <small>22</small>
                    </button>
                    <button class="key" data-key="v">
                        <span>V</span>
                        <small>23</small>
                    </button>
                    <button class="key" data-key="b">
                        <span>B</span>
                        <small>24</small>
                    </button>
                    <button class="key special" data-key="n">
                        <span>N</span>
                        <small>25</small>
                    </button>
                    <button class="key special" data-key="m">
                        <span>M</span>
                        <small>26</small>
                    </button>
                </div>
            </section>
        </main>
        <footer>
            <p>Use your keyboard to play • <span>24+ sounds</span></p>
        </footer>
    </div>

    <script src="violan.js"></script>
</body>
</html>
